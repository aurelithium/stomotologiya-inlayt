pg",alt:"Ручное стоматологическое электронное устройство SOGA",caption:"Дополнительное диагностическое устройство"},{src:"/images/unit-detail.jpg",alt:"Детали стоматологической установки, плевательница и панель ассистента",caption:"Оснащение стоматологического кресла"},{src:"/images/materials.jpg",alt:"Слепочные материалы COLTENE Speedex и металлические слепочные ложки",caption:"Слепочные материалы и расходные принадлежности"}],t0=[{n:"01",title:"Консультация и диагностика",text:"Бесплатный первичный осмотр, при необходимости — цифровой панорамный снимок ОПТГ на месте."},{n:"02",title:"План лечения и смета",text:"Врач объясняет диагноз, предлагает варианты и фиксирует стоимость «под ключ» до начала лечения."},{n:"03",title:"Бережное лечение",text:"Современная анестезия, стерильный инструмент, спокойная атмосфера и понятные комментарии врача."},{n:"04",title:"Контроль и профилактика",text:"Контрольные осмотры, рекомендации по домашнему уходу и напоминания о профессиональной гигиене."}],l0=[{icon:"card",title:"Банковская карта",note:"Оплата через терминал на ресепшен"},{icon:"cash",title:"Наличный расчёт",note:"С выдачей кассового чека"},{icon:"qr",title:"QR-код · СБП",note:"Оплата со смартфона за минуту"}],Ys=[{id:"license",title:"Лицензия на медицинскую деятельность",subtitle:"Сведения о лицензии и разрешённых видах работ",sections:[{p:[`Медицинская деятельность осуществляется ${G.legalName} на основании лицензии ${G.license}, предоставленной органом исполнительной власти: ${G.licenseIssuer}.`,`Адрес места осуществления лицензируемой деятельности: ${G.addressFull}.`]},{h:"Разрешённые виды работ и услуг",p:["Стоматология общей практики; стоматология терапевтическая; стоматология хирургическая; стоматология ортопедическая; ортодонтия; рентгенология (включая ортопантомографию)."]},{h:"Проверка сведений",p:["Актуальные сведения о лицензии содержатся в едином реестре лицензий Федеральной службы по надзору в сфере здравоохранения (Росздравнадзор): roszdravnadzor.gov.ru, раздел «Электронные сервисы → Реестр лицензий».","Заверенная выписка из реестра лицензий и копии учредительных документов предоставляются по запросу пациента на ресепшен клиники, а также размещены на информационном стенде «Уголок потребителя»."]}]},{id:"paid-rules",title:"Правила предоставления платных медицинских услуг",subtitle:"В соответствии с Постановлением Правительства РФ от 11.05.2023 № 736",sections:[{p:[`Платные медицинские услуги предоставляются ${G.legalName} на условиях и в порядке, установленных Правилами предоставления медицинскими организациями платных медицинских услуг (Постановление Правительства РФ от 11.05.2023 № 736), на основании договора, заключаемого в письменной форме между клиникой и потребителем (заказчиком).`,"Обращение за платными медицинскими услугами является добровольным. До заключения договора пациент информируется о возможности получения соответствующей медицинской помощи без взимания платы в рамках программы государственных гарантий бесплатного оказания гражданам медицинской помощи и территориальной программы ОМС."]},{h:"Договор и смета",p:["Договор содержит перечень платных услуг, их стоимость, сроки и порядок оплаты, условия и сроки оказания, ответственность сторон, порядок изменения и расторжения. По требованию пациента составляется твёрдая или приблизительная смета.","Дополнительные платные услуги, не предусмотренные договором, оказываются только после информирования пациента и получения его согласия, за исключением случаев оказания экстренной помощи по жизненным показаниям."]},{h:"Оплата и документы",p:["Оплата производится в рублях наличными денежными средствами, банковской картой или по QR-коду через СБП. После оплаты выдаётся кассовый чек.","По просьбе пациента клиника выдаёт копии медицинских документов, справки и рецепты, а также документы для получения социального налогового вычета на лечение (ст. 219 НК РФ).","Информация о ценах на сайте носит справочный характер и не является публичной офертой (ст. 437 ГК РФ). Итоговая стоимость определяется врачом после осмотра и закрепляется в договоре."]}]},{id:"privacy",title:"Политика обработки персональных данных",subtitle:"В соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ",sections:[{p:[`Настоящая политика определяет порядок обработки персональных данных оператором — ${G.legalName}, ИНН ${G.inn}, адрес: ${G.addressFull} (далее — Оператор). Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» и действует в отношении всей информации, которую Оператор может получить о посетителях сайта.`]},{h:"Состав данных и цели обработки",p:["Оператор обрабатывает: фамилию, имя, отчество; номер телефона; адрес электронной почты; сведения, сообщённые пользователем в комментарии к заявке. Данные, передаваемые при использовании сайта (файлы cookie, IP-адрес, данные браузера), обрабатываются в обезличенном виде.","Цели обработки: запись на приём и обратная связь; информирование о статусе заявки; направление напоминаний о визите; улучшение работы сайта. Оператор не обрабатывает специальные категории персональных данных о состоянии здоровья через формы сайта."]},{h:"Правовые основания и условия",p:["Обработка осуществляется на основании согласия субъекта персональных данных, выраженного при отправке формы (отметка в чекбоксе), а также в целях исполнения договора, стороной которого является субъект.","Обработка ведётся с использованием средств автоматизации и без них. Данные хранятся на серверах, расположенных на территории Российской Федерации (ч. 5 ст. 18 152-ФЗ). Передача третьим лицам не осуществляется, за исключением случаев, предусмотренных законодательством РФ.","Срок обработки — до достижения целей обработки либо до отзыва согласия. Отзыв согласия направляется на "+G.email+"; обработка прекращается в течение 30 дней с момента получения отзыва."]},{h:"Права субъекта и защита данных",p:["Субъект вправе получать сведения об обработке своих данных, требовать их уточнения, блокирования или уничтожения, а также обжаловать действия Оператора в Роскомнадзоре или в суде.","Оператор принимает правовые, организационные и технические меры для защиты данных от неправомерного доступа, изменения, раскрытия или уничтожения (ст. 18.1, 19 152-ФЗ)."]}]},{id:"consent",title:"Согласие на обработку персональных данных",subtitle:"Предоставляется при отправке заявки через сайт",sections:[{p:[`Заполняя форму на сайте, я, действуя свободно, своей волей и в своём интересе, даю согласие ${G.legalName} (ИНН ${G.inn}, ${G.addressFull}) на обработку моих персональных данных: имени, номера телефона, адреса электронной почты и иных сведений, указанных в заявке.`,"Согласие даётся на совершение следующих действий: сбор, запись, систематизация, накопление, хранение, уточнение (обновление, изменение), использование, блокирование, удаление и уничтожение данных — с использованием средств автоматизации и без таковых.","Цель обработки: организация записи на приём, обратная связь со мной по оставленной заявке, информирование о согласованных визитах.",`Согласие действует до его отзыва. Отзыв осуществляется путём направления письменного заявления на адрес электронной почты ${G.email} или почтового адреса клиники. Я подтверждаю, что ознакомлен(а) с Политикой обработки персональных данных.`]}]},{id:"rights",title:"Права и обязанности пациента",subtitle:"Федеральный закон от 21.11.2011 № 323-ФЗ, статьи 19–22",sections:[{h:"Пациент имеет право на",p:["Выбор врача и медицинской организации; профилактику, диагностику и лечение в условиях, соответствующих санитарно-гигиеническим требованиям; получение консультаций врачей-специалистов.","Облегчение боли, связанной с заболеванием и медицинским вмешательством, доступными методами и лекарственными препаратами.","Получение информации о своих правах и обязанностях, состоянии своего здоровья, выбор лиц, которым может быть передана информация о состоянии здоровья; сохранение врачебной тайны (ст. 13 323-ФЗ).","Информированное добровольное согласие на медицинское вмешательство и отказ от него в порядке ст. 20 323-ФЗ; возмещение вреда, причинённого здоровью при оказании медицинской помощи; допуск адвоката и законного представителя."]},{h:"Пациент обязан",p:["Заботиться о сохранении своего здоровья; соблюдать режим лечения и правила поведения в медицинской организации; уважительно относиться к персоналу и другим пациентам; своевременно сообщать врачу об изменениях самочувствия."]},{h:"Бесплатная медицинская помощь",p:["Граждане Российской Федерации имеют право на получение бесплатной медицинской помощи в рамках программы государственных гарантий и территориальной программы обязательного медицинского страхования в медицинских организациях — участниках территориальной программы ОМС. Обращение в нашу клинику за платными услугами является добровольным."]}]},{id:"authorities",title:"Контролирующие организации",subtitle:"Органы, осуществляющие надзор в сфере здравоохранения и защиты прав потребителей",sections:[{h:"Росздравнадзор",p:["Федеральная служба по надзору в сфере здравоохранения: 109012, г. Москва, Славянская площадь, д. 4, стр. 1. Горячая линия: 8 (800) 550-99-03. Сайт: roszdravnadzor.gov.ru."]},{h:"Департамент здравоохранения города Москвы",p:["127006, г. Москва, Оружейный переулок, д. 43. Телефон: +7 (495) 777-77-77. Сайт: mosgorzdrav.ru."]},{h:"Роспотребнадзор",p:["Управление Роспотребнадзора по городу Москве: 129626, г. Москва, Графский переулок, д. 4, корп. 2. Телефон: +7 (499) 973-26-90. Единый консультационный центр: 8 (800) 555-49-43. Сайт: rospotrebnadzor.ru.","Книга отзывов и предложений находится на стойке ресепшен и предоставляется по первому требованию."]}]}];function rm(f){var d,p,r="";if(typeof f=="string"||typeof f=="number")r+=f;else if(typeof f=="object")if(Array.isArray(f)){var y=f.length;for(d=0;d<y;d++)f[d]&&(p=rm(f[d]))&&(r&&(r+=" "),r+=p)}else for(p in f)f[p]&&(r&&(r+=" "),r+=p);return r}function a0(){for(var f,d,p=0,r="",y=arguments.length;p<y;p++)(f=arguments[p])&&(d=rm(f))&&(r&&(r+=" "),r+=d);return
